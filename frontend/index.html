<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <h1>Control de Gastos</h1>

    <!-- Balance / Resumen -->
    <div class="balance-cards">
      <div class="card total">
        <h3>Saldo Total</h3>
        <p>$1,250.00</p>
      </div>
      <div class="card income">
        <h3>Ingresos</h3>
        <p>+$2,000.00</p>
      </div>
      <div class="card expense">
        <h3>Gastos</h3>
        <p>-$750.00</p>
      </div>
    </div>

    <!-- Formulario para agregar movimiento -->
    <form class="form-group" onsubmit="event.preventDefault();">
      <input type="text" class="input-full" placeholder="Descripción (ej. Compras supermercado)" required>
      
      <div class="form-row">
        <input type="number" step="0.01" class="input-half" placeholder="Monto ($)" required>
        <select class="input-half" required>
          <option value="" disabled selected>Tipo</option>
          <option value="expense">Gasto</option>
          <option value="income">Ingreso</option>
        </select>
      </div>

      <div class="form-row">
        <select class="input-half" required>
          <option value="" disabled selected>Categoría</option>
          <option value="alimentacion">Alimentación</option>
          <option value="transporte">Transporte</option>
          <option value="servicios">Servicios</option>
          <option value="ocio">Ocio</option>
          <option value="sueldo">Sueldo</option>
        </select>
        <button type="submit" class="input-half">Agregar</button>
      </div>
    </form>

    <!-- Historial de Transacciones -->
    <h2 class="transactions-title">Movimientos Recientes</h2>
    <ul class="transaction-list">
      
      <li class="transaction-item expense">
        <div class="transaction-info">
          <span class="description">Supermercado</span>
          <span class="category">Alimentación</span>
        </div>
        <span class="transaction-amount amount-expense">-$120.00</span>
      </li>

      <li class="transaction-item income">
        <div class="transaction-info">
          <span class="description">Pago de Nómina</span>
          <span class="category">Sueldo</span>
        </div>
        <span class="transaction-amount amount-income">+$2,000.00</span>
      </li>

      <li class="transaction-item expense">
        <div class="transaction-info">
          <span class="description">Factura Internet</span>
          <span class="category">Servicios</span>
        </div>
        <span class="transaction-amount amount-expense">-$50.00</span>
      </li>

    </ul>
  </div>
<script> src="js/index.js"</script>
</body>
</html>
